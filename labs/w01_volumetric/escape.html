<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校正室密室逃脫 · W1 容量器具校正</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --night:#10252a;--night2:#173238;--tile:#d7e6e2;--tile2:#c3d6d1;--steel:#8fa3a6;--steel2:#5d7275;
  --amber:#f2b632;--alarm:#e0533d;--ok:#2f9e6b;--teal:#2c7a7b;--paper:#f6f8f4;--ink:#0f1d20;--ink2:#4a5d61;
  --lcd:#b9e3a1;--lcdink:#16301a;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--night);color:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.65}
button{font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px 40px}

/* HUD */
#hud{position:sticky;top:0;z-index:20;background:var(--night);border-bottom:1px solid #2a464c;padding:10px 0}
#hud .row{max-width:1120px;margin:0 auto;padding:0 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#hud h1{font-size:1.05rem;margin:0;font-weight:900;letter-spacing:.02em;flex:1 1 220px}
#hud h1 small{display:block;font-weight:500;color:var(--steel);font-size:.78rem}
.clock{font-family:var(--mono);font-size:1.5rem;color:var(--amber);min-width:5.2ch;text-align:right}
.frags{display:flex;gap:6px}
.frag{width:38px;height:46px;border-radius:6px;border:2px dashed #3b5a60;display:grid;place-items:center;font-family:var(--mono);font-size:1.5rem;color:var(--steel2);position:relative}
.frag.got{border:2px solid var(--amber);color:var(--amber);background:#1f3a40}
.frag i{position:absolute;bottom:-1px;right:3px;font-style:normal;font-size:.6rem;color:var(--steel);font-family:var(--sans)}
.hudbtn{background:transparent;border:1.5px solid #3b5a60;color:var(--tile);border-radius:8px;padding:5px 11px;font-size:.88rem}
.hudbtn:hover{border-color:var(--amber);color:var(--amber)}
.pts{font-size:.88rem;color:var(--tile)}

/* stage */
.roombar{display:flex;gap:8px;margin:14px 0 8px;flex-wrap:wrap}
.roombar button{background:var(--night2);border:1.5px solid #2f4d53;color:var(--tile);border-radius:8px;padding:6px 14px}
.roombar button[aria-current="true"]{background:var(--tile);color:var(--ink);border-color:var(--tile);font-weight:700}
.roombar button:disabled{opacity:.45;cursor:not-allowed}
#stage{position:relative;border-radius:14px;overflow:hidden;background:var(--tile);aspect-ratio:1000/560;box-shadow:0 10px 40px rgba(0,0,0,.45)}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hs{position:absolute;background:transparent;border:2px solid transparent;border-radius:10px;padding:0}
.hs::after{content:"";position:absolute;right:-7px;top:-7px;width:16px;height:16px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 rgba(242,182,50,.7);animation:ping 2.4s infinite}
.hs.done::after{background:var(--ok);animation:none}
.hs.locked::after{background:var(--alarm);animation:none}
.hs:hover,.hs:focus-visible{border-color:var(--amber);background:rgba(242,182,50,.12)}
.hs span{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--paper);font-size:.8rem;padding:2px 8px;border-radius:5px;opacity:0;pointer-events:none;transition:opacity .15s}
.hs:hover span,.hs:focus-visible span{opacity:1}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,182,50,.7)}70%{box-shadow:0 0 0 12px rgba(242,182,50,0)}100%{box-shadow:0 0 0 0 rgba(242,182,50,0)}}
@media (prefers-reduced-motion:reduce){.hs::after{animation:none}}
.objlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.objlist button{background:transparent;border:1px solid #2f4d53;color:var(--steel);border-radius:99px;padding:2px 12px;font-size:.84rem}
.objlist button:hover{color:var(--amber);border-color:var(--amber)}

/* inventory + log */
.lower{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;margin-top:16px}
@media(max-width:760px){.lower{grid-template-columns:1fr}}
@media(max-width:600px){#hud{position:static}}
.panel{background:var(--night2);border:1px solid #2a464c;border-radius:12px;padding:12px 14px}
.panel h2{font-size:.95rem;margin:0 0 8px;color:var(--tile)}
.inv{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.inv button{background:var(--paper);color:var(--ink);border:none;border-radius:8px;padding:6px 10px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.inv .empty{color:var(--steel2);font-size:.88rem}
#log{max-height:150px;overflow:auto;font-size:.88rem;color:var(--tile);margin:0;padding:0;list-style:none}
#log li{margin:2px 0}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(6,16,18,.72);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) 12px 40px}
#modal.open{display:flex}
.card{background:var(--paper);color:var(--ink);border-radius:14px;max-width:760px;width:100%;padding:20px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative}
.card h3{margin:0 0 4px;font-size:1.25rem;font-weight:900}
.card .where{color:var(--teal);font-size:.85rem;font-weight:700}
.card p{margin:.5em 0}
.x{position:absolute;right:10px;top:8px;background:none;border:none;font-size:1.6rem;color:var(--ink2);line-height:1}
.btn{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:disabled{opacity:.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;display:none;font-size:.95rem}
.fb.show{display:block}
.fb.ok{background:#e1f3ea;border-left:4px solid var(--ok)}
.fb.no{background:#fbe7e3;border-left:4px solid var(--alarm)}
.fb.hint{background:#fdf3d9;border-left:4px solid var(--amber)}
.lcd{font-family:var(--mono);background:var(--lcd);color:var(--lcdink);border-radius:6px;padding:4px 12px;font-size:1.6rem;display:inline-block;border:3px solid #3e5a3a}
.paper{background:#fffef8;border:1px solid #e3dcc4;border-radius:6px;padding:10px 14px;font-size:.95rem}
input.num{font-family:var(--mono);font-size:1.3rem;width:9ch;padding:4px 8px;border:2px solid var(--steel);border-radius:6px;background:#fff;color:var(--ink)}
select{font:inherit;border:1.5px solid var(--steel);border-radius:6px;padding:3px 6px;background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:#fff;border:1.5px solid var(--steel);border-radius:8px;padding:5px 10px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.seq{min-height:48px;border:2px dashed var(--steel);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;margin:8px 0}
.seq button{text-align:left;background:#eef4f2;border:1px solid var(--tile2);border-radius:6px;padding:5px 10px;color:var(--ink)}
.seq .n{font-family:var(--mono);color:var(--teal);margin-right:6px}
.sheet{overflow-x:auto;margin:8px 0}
.sheet table{border-collapse:collapse;font-family:var(--mono);font-size:.92rem}
.sheet td,.sheet th{border:1px solid #c9d3d0;padding:3px 8px;text-align:right}
.sheet th{background:#e8eeec;font-weight:400;color:var(--ink2)}
.sheet td.sel{background:#d6ecff}
.fbar{font-family:var(--mono);background:#fff;border:1px solid #c9d3d0;padding:4px 10px;border-radius:4px;font-size:.95rem}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:.9rem;width:100%}
.tbl td,.tbl th{border-bottom:1px solid #dfe6e3;padding:3px 8px;text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.svgbox{overflow-x:auto}
.svgbox svg{width:100%;min-width:520px;height:auto;display:block}
.svgbox text{font-size:12px;fill:var(--ink2);font-family:var(--sans)}
.dx{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.dx .c{border:1px solid #d8e0dd;border-radius:10px;padding:8px 10px;background:#fff}
.dx .c b{font-family:var(--mono)}
.keypad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;margin:10px 0}
.keypad button{height:52px;font-family:var(--mono);font-size:1.4rem;border-radius:8px;border:none;background:#24383c;color:var(--paper)}
.keypad button:hover{background:var(--teal)}
.who{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
.who .av{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:#e4efec}
.who .bub{background:#eef4f2;border-radius:4px 12px 12px 12px;padding:8px 12px}
.who .nm{font-size:.8rem;color:var(--teal);font-weight:700}
.end-stats{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}
.end-stats div{font-size:.85rem;color:var(--ink2)}
.end-stats b{display:block;font-family:var(--mono);font-size:1.6rem;color:var(--ink)}
.foot{margin-top:18px;font-size:.85rem;color:var(--steel)}
.foot a{color:var(--amber)}
</style>
</head>
<body>
<header id="hud">
  <div class="row">
    <h1>校正室密室逃脫<small>W1 容量器具校正 · 班級真實數據(2026-09-29)</small></h1>
    <div class="frags" aria-label="密碼碎片">
      <div class="frag" id="fr0"><span>?</span><i>①</i></div>
      <div class="frag" id="fr1"><span>?</span><i>②</i></div>
      <div class="frag" id="fr2"><span>?</span><i>③</i></div>
      <div class="frag" id="fr3"><span>?</span><i>④</i></div>
    </div>
    <div class="clock" id="clock" title="稽核倒數">45:00</div>
    <span class="pts" id="pts">積分 0</span>
    <button class="hudbtn" id="login">登入學號</button>
    <button class="hudbtn" id="reset">重新開始</button>
  </div>
</header>

<main class="wrap">
  <nav class="roombar" id="rooms" aria-label="房間"></nav>
  <div id="stage" role="region" aria-label="場景"></div>
  <div class="objlist" id="objlist" aria-label="本房間可調查的物件"></div>

  <div class="lower">
    <section class="panel">
      <h2>背包(點物品可查看)</h2>
      <div class="inv" id="inv"></div>
    </section>
    <section class="panel">
      <h2>調查紀錄</h2>
      <ul id="log"></ul>
    </section>
  </div>
  <p class="foot">數據來源:<a href="materials/w01_class_data_corrected.xlsx">W01 班級數據(修正版)</a>,學號已匿名。換算:V(µL) = m(g) × Fb ÷ ρw × 1000,Fb = 1.0011,ρw(32 °C) = 0.99503 g/mL。
  · <a href="detective.html">Data Detective</a> · <a href="index.html">回 W1</a></p>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"><div class="card" id="mcard"></div></div>

<script type="module" src="assess_firebase.js"></script>
<script>
/* ============================================================
   數據:15 位 × 10 次單次質量 (g),與 detective.html 相同
   ============================================================ */
var D=[[0.1927,0.1918,0.1917,0.1924,0.1922,0.1914,0.1914,0.1917,0.192,0.1919],[0.1972,0.1994,0.189,0.1892,0.2002,0.1894,0.1901,0.1898,0.1994,0.1963],[0.1932,0.1905,0.1895,0.1884,0.1949,0.1942,0.1859,0.1883,0.1876,0.1937],[0.1903,0.1893,0.1881,0.1897,0.1888,0.1871,0.1856,0.1958,0.1889,0.1953],[0.1892,0.1891,0.1777,0.1736,0.1887,0.1885,0.1893,0.189,0.1892,0.1885],[0.1895,0.1895,0.1892,0.19,0.1896,0.1898,0.1904,0.1908,0.1894,0.1898],[0.1899,0.1951,0.19,0.1893,0.1899,0.1909,0.2061,0.189,0.189,0.1939],[0.211,0.1839,0.1898,0.1868,0.203,0.1899,0.1943,0.1905,0.1553,0.1885],[0.1927,0.1921,0.1901,0.1901,0.1895,0.1908,0.1893,0.1835,0.1896,0.1923],[0.1875,0.1877,0.1997,0.1922,0.1908,0.1892,0.1978,0.1906,0.1804,0.1867],[0.1843,0.1882,0.1887,0.1886,0.1891,0.1913,0.2487,0.1353,0.192,0.1764],[0.1894,0.1842,0.1889,0.1886,0.1892,0.2003,0.1912,0.1901,0.1906,0.1809],[0.1884,0.1887,0.1883,0.1884,0.1904,0.1897,0.1881,0.1939,0.1889,0.1904],[0.1891,0.1896,0.1887,0.1884,0.188,0.1888,0.1887,0.1892,0.1891,0.197],[0.1909,0.1906,0.1894,0.1913,0.1915,0.1738,0.1909,0.1923,0.1914,0.1904]];
var RHO=0.99503,FB=1.0011,NOM=200,T9=2.262;
function toUL(g){return g*FB/RHO*1000}
var C=D.map(function(r){return r.map(toUL)});
function st(a){var n=a.length,m=a.reduce(function(s,x){return s+x},0)/n,ss=a.reduce(function(s,x){return s+(x-m)*(x-m)},0),sd=Math.sqrt(ss/(n-1)),hw=T9*sd/Math.sqrt(n);return{m:m,sd:sd,rsd:sd/m*100,hw:hw,lo:m-hw,hi:m+hw,sdp:Math.sqrt(ss/n)}}
var S=C.map(st);
function lab(i){return 'S'+(i<9?'0':'')+(i+1)}
function f(x,d){return x.toFixed(d==null?2:d)}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ============================================================
   狀態(仿 escape-game-engine:scene / inventory / flags)
   ============================================================ */
var KEY='w01escape_v1',LIMIT=45*60;
var G;
function fresh(){return{scene:'A',items:[],flags:{},frags:[null,null,null,null],solved:{},hints:{},pts:0,elapsed:0,log:[],done:false}}
function load(){try{G=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){G=null}if(!G||!G.flags)G=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function has(it){return G.items.indexOf(it)>=0}
function give(it){if(!has(it)){G.items.push(it);note('獲得:'+ITEMS[it].icon+' '+ITEMS[it].name)}renderInv();save()}
function flag(k){return !!G.flags[k]}
function setFlag(k){G.flags[k]=true;save()}
function note(t){G.log.push(t);renderLog()}
function addPts(n){G.pts+=n;$('pts').textContent='積分 '+G.pts;save()}
function setFrag(i,d){G.frags[i]=d;renderFrags();save()}

/* ---------- 紀錄到 Firebase(與 detective.html 相同的 AssessFB 介面) ---------- */
var LOGGING=false,ATT={},MIS={},SIDK='food_analysis_student_id';
function ev(o){if(!LOGGING||!window.AssessFB)return;try{window.AssessFB.log(o)}catch(e){}}
function ans(qid,ok,o){o=o||{};ATT[qid]=(ATT[qid]||0)+1;if(ok===false&&o.misconception)MIS[o.misconception]=(MIS[o.misconception]||0)+1;
  ev({event_type:'answer',question_id:'ESC-'+qid,is_correct:ok,attempts:ATT[qid],qtype:o.qtype||'mcq',bloom:o.bloom||null,topic:o.topic||null,misconception:(ok===false&&o.misconception)?o.misconception:null,chapter:'LAB-W01'})}
function login(){var b=$('login');b.disabled=true;b.textContent='連線中…';var t=0;
  (function poll(){
    if(window.AssessFB){window.AssessFB.init({chapter:'LAB-W01',game:'escape'}).then(function(){LOGGING=true;b.textContent='已記錄('+window.AssessFB.getStudentId()+')'}).catch(function(){b.disabled=false;b.textContent='登入學號'});return}
    if(++t>120){b.disabled=false;b.textContent='登入失敗,稍後再試';return}
    setTimeout(poll,50)})()}
$('login').onclick=login;
try{if(localStorage.getItem(SIDK))login()}catch(e){}

/* ============================================================
   物品
   ============================================================ */
var ITEMS={
  temp:{icon:'🌡️',name:'水溫紀錄',desc:'<p>實驗當天蒸餾水溫度:<b>32 °C</b>。</p><p class="paper">便利貼:「水溫要先和室溫平衡,不然密度會一直變。」</p>'},
  density:{icon:'📄',name:'水密度表',desc:'<div class="tbl"><table><tr><th>水溫 (°C)</th><th>ρw (g/mL,Tanaka)</th></tr><tr><td>20</td><td>0.99821</td></tr><tr><td>25</td><td>0.99705</td></tr><tr><td>28</td><td>0.99624</td></tr><tr><td>30</td><td>0.99565</td></tr><tr><td>32</td><td>0.99503</td></tr><tr><td>35</td><td>0.99403</td></tr></table></div><p>底部手寫:<b>浮力校正 Fb = 1.0011</b>(空氣比砝碼密度小,秤到的水會被「托輕」一點)。</p><p class="paper">V = m × Fb ÷ ρw</p>'},
  drawerKey:{icon:'🗝️',name:'抽屜鑰匙',desc:'<p>天平底座下找到的小鑰匙。上面刻著「SOP」。</p>'},
  cardB:{icon:'💳',name:'電腦室門禁卡',desc:'<p>卡片背面印著正確的重量法校正流程。</p>'},
  ttable:{icon:'📐',name:'t 值卡',desc:'<p>自由度 df = n − 1 = 9,雙尾 95%:<b>t = 2.262</b>(不是 1.96)。</p><p class="paper">95% CI = x̄ ± t × SD ÷ √n</p>'},
  report:{icon:'📁',name:'診斷報告',desc:'<p>你分好類的誤差診斷:系統誤差、隨機誤差、過失誤差。出口門要掃描這份報告。</p>'}
};

/* ============================================================
   場景圖(SVG)
   ============================================================ */
function tiles(){var s='<defs><pattern id="tl" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#d7e6e2"/><path d="M40 0H0V40" fill="none" stroke="#c3d6d1" stroke-width="2"/></pattern><linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3d40"/><stop offset="1" stop-color="#1c2b2e"/></linearGradient><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d4d5"/><stop offset="1" stop-color="#8fa3a6"/></linearGradient></defs><rect width="1000" height="560" fill="url(#tl)"/>';return s}
function door(x,locked,label){return '<g><rect x="'+x+'" y="120" width="130" height="300" rx="4" fill="#5d7275"/><rect x="'+(x+8)+'" y="128" width="114" height="292" fill="#7c9295"/><rect x="'+(x+30)+'" y="150" width="70" height="60" fill="#b9d3d6" stroke="#5d7275" stroke-width="4"/><rect x="'+(x+98)+'" y="270" width="16" height="34" rx="3" fill="'+(locked?'#e0533d':'#2f9e6b')+'"/><text x="'+(x+65)+'" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#10252a" font-family="Noto Sans TC">'+label+'</text></g>'}
var SVG={
A:function(){return '<svg viewBox="0 0 1000 560" aria-hidden="true">'+tiles()+
  // poster
  '<g><rect x="70" y="60" width="170" height="210" fill="#fffef8" stroke="#bfb79c" stroke-width="3"/><text x="155" y="92" text-anchor="middle" font-size="17" font-weight="900" fill="#10252a" font-family="Noto Sans TC">水的密度</text>'+[0,1,2,3,4,5].map(function(i){return '<rect x="92" y="'+(108+i*24)+'" width="126" height="14" fill="'+(i==4?'#f2b632':'#e5e9e4')+'"/>'}).join('')+'</g>'+
  // bench

var WRONG={},LOCK={};
function wrongLock(pid,html,kind,els){var k=WRONG[pid]=(WRONG[pid]||0)+1,sec=kind==='num'?(k>=2?10:0):5;
  fb(html,'no');if(!sec)return;LOCK[pid]=Date.now()+sec*1000;applyLock(pid,html,els)}
function applyLock(pid,html,els){els=(els||[$('chk')]).filter(Boolean);if(!els.length)return;els.forEach(function(e){e.disabled=true});
  (function tick(){if(!document.body.contains(els[0]))return;var left=Math.ceil((LOCK[pid]-Date.now())/1000);
    if(left<=0){els.forEach(function(e){e.disabled=false});fb(html,'no');return}
    fb(html+'<div style="margin-top:6px;font-size:.85em;opacity:.8">⏳ 先想一想(或按「提示」),'+left+' 秒後可以再試</div>','no');setTimeout(tick,500)})()}

function ending(){
  var t=G.elapsed,mm=Math.floor(t/60),ss=t%60,used=Object.keys(G.hints).reduce(function(a,k){return a+G.hints[k]},0);
  var ks=Object.keys(MIS).filter(function(k){return ADV[k]}).sort(function(a,b){return MIS[b]-MIS[a]}).slice(0,4);
  var dx=Object.keys(MIS).filter(function(k){return k.indexOf('dx:')===0}).length;
  var rec=ks.map(function(k){return '<li>'+ADV[k]+'(錯 '+MIS[k]+' 次)</li>'}).join('')+(dx?'<li>誤差類型判斷:看「偏的方向固不固定」和「有沒有單點離很遠」</li>':'');
  modal('<h3>你逃出來了</h3><p>天亮前,你交出一份可信的校正報告:</p>'+
   '<div class="end-stats"><div><b>'+mm+':'+(ss<10?'0':'')+ss+'</b>用時</div><div><b>'+G.pts+'</b>積分</div><div><b>'+used+'</b>提示</div></div>'+
   '<p class="paper">結論:這一班多數人的<b>精密度</b>落在 1–3%(RSD 中位數約 '+f(S.map(function(q){return q.rsd}).sort(function(a,b){return a-b})[7])+'%),但<b>準確度</b>整體偏低約 '+f((200-S.reduce(function(a,q){return a+q.m},0)/15)/2,1)+'%。下一步先校正吸管(檢查設定值、吸頭密合、預潤與排液角度),而不是要求大家多量幾次。</p>'+
   (rec?'<p><b>學習回饋卡</b></p><ul>'+rec+'</ul>':'<p>這一輪沒有明顯迷思。</p>')+
   '<div class="acts"><a class="btn" href="detective.html" style="text-decoration:none">去玩 Data Detective</a><button class="btn ghost" id="again">再玩一次</button></div>');
  $('again').onclick=function(){resetGame()}}

/* ---------- 計時 ---------- */
var tick=null;
function drawClock(){var left=LIMIT-G.elapsed,neg=left<0,a=Math.abs(left);$('clock').textContent=(neg?'+':'')+Math.floor(a/60)+':'+((a%60)<10?'0':'')+(a%60);$('clock').style.color=neg?'var(--alarm)':''}
function startClock(){if(tick||G.done)return;tick=setInterval(function(){if(document.hidden)return;G.elapsed++;drawClock();if(G.elapsed%10===0)save()},1000)}
function stopClock(){clearInterval(tick);tick=null;save()}

/* ---------- 開場 ---------- */
function intro(){modal('<div class="where">晚上 8:12 · 食品檢驗實驗室</div><h3>稽核明天早上 9 點</h3>'+
  '<div class="who"><div class="av">👩‍🔬</div><div><div class="nm">品保主任(語音訊息)</div><div class="bub">上週 15 位同學的 200 µL 吸管校正數據,稽核員明早要看。系統發現<b>報表有錯</b>,把整間實驗室鎖了。<br>修好數據、找出問題,出口才會開。45 分鐘內搞定。</div></div></div>'+
  '<p>點場景中閃<span style="color:#b38300;font-weight:700">黃點</span>的物件調查。綠點 = 已完成,紅點 = 還鎖著。集齊 4 個密碼碎片和診斷報告就能離開。</p>'+
  '<div class="acts"><button class="btn" id="go">開始調查</button></div>');
  $('go').onclick=function(){G.flags.started=true;save();closeModal();startClock()}}
function resetGame(){if(!confirm('清除進度,從頭開始?'))return;stopClock();G=fresh();ATT={};MIS={};save();closeModal();drawClock();intro()}
$('reset').onclick=resetGame;

load();render();drawClock();
if(G.done){ending()}else if(!G.flags.started){intro()}else{startClock()}
</script>
</body>
</html>
